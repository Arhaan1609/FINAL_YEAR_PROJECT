# ──────────────────────────────────────────────────────────────
# Docker Compose — EV Battery Intelligence System
# Run from project root: docker compose -f cloud-experiments/exp2-docker/docker-compose.yml up --build
# ──────────────────────────────────────────────────────────────
services:
  backend:
    build:
      context: ../../
      dockerfile: cloud-experiments/exp2-docker/Dockerfile.backend
    image: ${DOCKERHUB_USER:-evbattery}/ev-battery-backend:latest
    container_name: ev-battery-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "4.0"
        reservations:
          memory: 2g
          cpus: "1.0"
    restart: unless-stopped

  frontend:
    build:
      context: ../../
      dockerfile: cloud-experiments/exp2-docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8000}"
    image: ${DOCKERHUB_USER:-evbattery}/ev-battery-frontend:latest
    container_name: ev-battery-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.5"
    restart: unless-stopped
